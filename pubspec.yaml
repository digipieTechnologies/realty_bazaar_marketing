name: realty_marketing
description: "Realty Marketing App."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.8 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  go_router: ^17.3.0
  event_bus_plus: ^0.6.2
  dio: ^5.10.0
  get_storage: ^2.1.1
  shimmer: ^3.0.0
  supabase_flutter: ^2.15.4
  provider: ^6.1.2
  cached_network_image: ^3.3.1
  equatable: ^2.0.5
  url_launcher: ^6.3.2
  shared_preferences: ^2.2.0
  file_picker: ^11.0.2
  permission_handler: ^11.4.0
  geolocator: ^13.0.2
  video_thumbnail: ^0.5.6
  video_player: ^2.11.1
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.10.0
  onesignal_flutter: ^5.2.8
  device_info_plus: ^11.1.0
  pinput: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - config.json
    - assets/logo/
    - assets/icons/
    - assets/lang/
    - assets/images/

flutter_launcher_icons:
  image_path: "assets/logo/app_logo.png"
  android: true
  ios: true
  macos:
    generate: true
  web:
    generate: true
    image_path: "assets/logo/app_logo.png"
  windows:
    generate: true
    image_path: "assets/logo/app_logo.png"
